{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6fbf8">
  <meta name="description" content="Learn practical Cebuano for everyday conversations with Bisdak Basics.">
  <title>{% block title %}Bisdak Basics{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="{% static 'images/bito-favicon.png' %}?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/bito-touch-icon.png' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% if messages %}
    <div class="message-stack" aria-live="polite" aria-atomic="true">
      {% for message in messages %}
        <div class="message message--{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="{% static 'js/site.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
